<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #0A0A0A; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  svg { width: 100px; height: 100px; color: #f97316; }
  .blade1 { transform-origin: 12px 12px; animation: b1 1.5s infinite ease-in-out; }
  .blade2 { transform-origin: 12px 12px; animation: b2 1.5s infinite ease-in-out; }
  @keyframes b1 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-35deg); } }
  @keyframes b2 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(35deg); } }
</style>
</head>
<body>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none" />
    <g class="blade1">
      <circle cx="6" cy="6" r="3" />
      <path d="M8.12 8.12 L12 12 L20 20" />
    </g>
    <g class="blade2">
      <circle cx="6" cy="18" r="3" />
      <path d="M8.12 15.88 L12 12 L20 4" />
    </g>
  </svg>
</body>
</html>
